<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>자전거 관리법</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <button class="brand-button" type="button" data-screen="home">자전거 관리법</button>
      </header>

      <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>

      <section class="screen" id="home-screen" aria-labelledby="home-title">
        <h1 id="home-title">자전거 관리법</h1>
        <div class="home-actions">
          <button class="primary-button" type="button" data-screen="schedule">날짜별 관리 일정</button>
          <button class="primary-button" type="button" data-screen="situations">상황별 자전거 관리법</button>
        </div>
      </section>

      <section class="screen" id="schedule-screen" aria-labelledby="schedule-title" hidden>
        <button class="back-button" type="button" data-screen="home">자전거 관리법</button>
        <h1 id="schedule-title">날짜별 관리 일정</h1>
        <label class="date-label" for="schedule-date">날짜</label>
        <input id="schedule-date" type="date">
        <ul class="checklist" id="maintenance-list"></ul>
      </section>

      <section class="screen" id="situations-screen" aria-labelledby="situations-title" hidden>
        <button class="back-button" type="button" data-screen="home">자전거 관리법</button>
        <h1 id="situations-title">상황별 자전거 관리법</h1>
        <div class="situation-actions">
          <button class="primary-button" type="button" data-situation="rain">자전거가 비에 젖었어요</button>
          <button class="primary-button" type="button" data-situation="before-ride">라이딩 전이에요</button>
          <button class="primary-button" type="button" data-situation="fall">자전거가 넘어졌어요</button>
        </div>
      </section>

      <section class="screen" id="guide-screen" aria-labelledby="guide-title" hidden>
        <button class="back-button" type="button" data-screen="situations">상황별 자전거 관리법</button>
        <h1 id="guide-title"></h1>
        <ul class="guide-list" id="guide-list"></ul>
      </section>
    </main>
  </body>
</html>
